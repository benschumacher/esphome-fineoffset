---
esphome:
  name: fineoffset-example
  friendly_name: FineOffset Example

esp32:
  board: esp32dev
  framework:
    type: arduino

external_components:
  - source: components

fineoffset:
  - name: FineOffset Radio
    id: fineoffset_radio
    pin: GPIO33

sensor:
  - platform: fineoffset
    fineoffset_id: fineoffset_radio
    sensor_number: 77               # WH2 sensor numbers change on battery swap; see below
    timeout: 30min                  # silence before `online` goes off / a new number is followed
    follow_new_sensor_number: true  # snaps back if 77 returns
    configured_sensor_number:
      name: Deck Configured Sensor No.
    active_sensor_number:
      name: Deck Active Sensor No.
    online:
      name: Deck Sensor Online
    sensor_number_update:
      name: Deck Sensor No.
    apply_new_sensor_number:
      name: Deck Apply New Sensor No.
    temperature:
      name: Deck Temperature
    humidity:
      name: Deck Humidity

  - platform: fineoffset
    fineoffset_id: fineoffset_radio
    sensor_number: 23
    temperature:
      name: Temperature
    humidity:
      name: Humidity

text_sensor:
  - platform: fineoffset
    name: Last Sensor Data
    type: last

  - platform: fineoffset
    name: Bad Sensor Data (CRC failed)
    type: last_bad

  - platform: fineoffset
    name: Unknown Sensor Number
    type: unknown
