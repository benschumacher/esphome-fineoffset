---
esphome:
  name: fineoffset-example
  friendly_name: FineOffset Example

esp32:
  board: esp32dev
  framework:
    type: arduino

external_components:
  - source: components

fineoffset:
  - name: FineOffset Radio
    id: fineoffset_radio
    pin: GPIO33

sensor:
  - platform: fineoffset
    fineoffset_id: fineoffset_radio
    sensor_no: 77     # WH2 IDs change on battery swap; see drift below
    timeout: 30min    # silence before `online` goes off / drift is allowed
    drift: true       # follow a new ID after `timeout` of silence; snaps back if 77 returns
    sensor_no_number:
      name: Deck Sensor ID
    active_sensor_no:
      name: Deck Active Sensor ID
    online:
      name: Deck Sensor Online
    drifted:
      name: Deck Sensor Drifted
    accept_drift:
      name: Deck Accept Drift
    temperature:
      name: Deck Temperature
    humidity:
      name: Deck Humidity

  - platform: fineoffset
    fineoffset_id: fineoffset_radio
    sensor_no: 23
    temperature:
      name: Temperature
    humidity:
      name: Humidity

text_sensor:
  - platform: fineoffset
    name: Last Sensor Data
    type: last

  - platform: fineoffset
    name: Bad Sensor Data (CRC failed)
    type: last_bad

  - platform: fineoffset
    name: Unknown Sensor Number
    type: unknown
