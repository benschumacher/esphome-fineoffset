# Home Assistant package: nag notifications for a FineOffset sensor that drifted or went offline.
#
# Drop into your HA packages directory (e.g. packages/fineoffset_deck.yaml) and adjust:
#   - entity IDs below assume ESPHome device "fineoffset-example" and the entity names from example.yaml
#   - notifier: replace mobile_app_your_phone with your Companion app notifier
#
# Uses the `alert` integration (repeats until resolved/acknowledged) rather than a one-shot automation,
# so a missed notification gets re-sent.

alert:
  deck_sensor_drifted:
    name: Deck sensor ID drifted
    entity_id: binary_sensor.fineoffset_example_deck_sensor_drifted
    state: "on"
    repeat: 720  # minutes; re-notify twice a day until accepted (or the original ID returns)
    skip_first: false
    can_acknowledge: true
    title: Deck sensor
    message: >-
      Following new ID {{ states('sensor.fineoffset_example_deck_active_sensor_id') | int(0) }}
      instead of {{ states('number.fineoffset_example_deck_configured_sensor_id') | int(0) }}
      (batteries changed?). Tap Accept to make it permanent.
    done_message: clear_notification  # removes the notification once resolved
    notifiers:
      - mobile_app_your_phone
    data:
      tag: fineoffset-deck-drifted
      actions:
        - action: FINEOFFSET_ACCEPT_DECK_DRIFT
          title: Accept

  deck_sensor_offline:
    name: Deck sensor offline
    # `online` already waits for the component `timeout` (30min) of silence. skip_first + the first
    # repeat step adds another 30min, so device reboots and a quick battery swap (which drifts within a
    # few minutes and comes back online) don't notify.
    entity_id: binary_sensor.fineoffset_example_deck_sensor_online
    state: "off"
    repeat: [30, 720]
    skip_first: true
    can_acknowledge: true
    title: Deck sensor
    message: No readings from the deck sensor for over an hour. Batteries are likely dead.
    done_message: clear_notification
    notifiers:
      - mobile_app_your_phone
    data:
      tag: fineoffset-deck-offline

automation:
  - id: fineoffset_accept_deck_drift
    alias: Accept deck sensor drift from notification
    triggers:
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: FINEOFFSET_ACCEPT_DECK_DRIFT
    actions:
      - action: button.press
        target:
          entity_id: button.fineoffset_example_deck_accept_drift
